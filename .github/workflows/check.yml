name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install duckdb git+https://github.com/subordinal/readyml
      - name: Unit tests
        run: python -W error -m unittest discover -s tests
      - name: Quality checks on the published tables
        run: python -m pipeline.verify
